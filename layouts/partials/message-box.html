<style>
.sidebar__message-icon {
  text-align: center;
  margin-top: 14px;
}

.sidebar__message-icon a i {
  color: #ff6b6b;
  transition: color 0.2s, transform 0.2s;
}

.sidebar__message-icon a:hover i {
  color: #ee5a24;
  transform: scale(1.15);
}

.sidebar__message-box {
  margin-top: 16px;
  padding: 0 10px;
  text-align: left;
}

.sidebar__message-prompt {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 12px;
  line-height: 1.5;
}

.sidebar__message-input,
.sidebar__message-textarea {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 8px;
  border: 1px solid #444;
  border-radius: 6px;
  font-size: 13px;
  box-sizing: border-box;
  font-family: inherit;
  background: transparent;
  color: inherit;
}

.sidebar__message-textarea {
  height: 70px;
  resize: vertical;
}

.sidebar__message-send {
  width: 100%;
  padding: 8px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.sidebar__message-send:hover { opacity: 0.9; }
.sidebar__message-send:disabled { opacity: 0.5; cursor: not-allowed; }

.sidebar__message-success {
  color: #667eea;
  font-size: 13px;
  text-align: center;
  padding: 6px 0;
  display: none;
}
</style>

<script>
(function () {
  var API_URL = "https://n4ge8kjgyk.execute-api.us-east-1.amazonaws.com/prod/track";

  document.getElementById("msgSend").addEventListener("click", function () {
    var btn = this;
    var name = document.getElementById("msgName").value.trim();
    var email = document.getElementById("msgEmail").value.trim();
    var message = document.getElementById("msgText").value.trim();

    if (!message) return;

    var vid = localStorage.getItem("_vid") || "anonymous";

    btn.disabled = true;
    btn.textContent = "Sending...";

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        visitor_id: vid,
        type: "message",
        page: window.location.pathname,
        name: name,
        email: email,
        message: message,
      }),
    })
      .then(function () {
        document.getElementById("msgSuccess").style.display = "block";
        document.getElementById("msgName").value = "";
        document.getElementById("msgEmail").value = "";
        document.getElementById("msgText").value = "";
        btn.textContent = "Send";
        btn.disabled = false;
        setTimeout(function () {
          document.getElementById("msgSuccess").style.display = "none";
        }, 3000);
      })
      .catch(function () {
        btn.textContent = "Send";
        btn.disabled = false;
      });
  });
})();
</script>
