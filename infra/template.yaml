AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Visitor tracking backend for portfolio site

Parameters:
  DashboardPassword:
    Type: String
    Default: changeme
    NoEcho: true
    Description: Password to access the visitor stats dashboard
  ExistingTableName:
    Type: String
    Default: portfolio-visitors
    Description: Name of the existing DynamoDB visitor table

Globals:
  Function:
    Timeout: 10
    Runtime: python3.13
    Tags:
      auto-delete: "no"

Resources:
  TrackVisitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: track_visitor.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExistingTableName
      Environment:
        Variables:
          TABLE_NAME: !Ref ExistingTableName
      Events:
        TrackApi:
          Type: Api
          Properties:
            Path: /track
            Method: post
            RestApiId: !Ref VisitorApi

  GetStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: get_stats.handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExistingTableName
      Environment:
        Variables:
          TABLE_NAME: !Ref ExistingTableName
          DASHBOARD_PASSWORD: !Ref DashboardPassword
      Events:
        StatsApi:
          Type: Api
          Properties:
            Path: /stats
            Method: get
            RestApiId: !Ref VisitorApi

  VisitorApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Tags:
        auto-delete: "no"

Outputs:
  ApiEndpoint:
    Description: Visitor tracking API endpoint
    Value: !Sub "https://${VisitorApi}.execute-api.${AWS::Region}.amazonaws.com/prod/track"
  StatsEndpoint:
    Description: Visitor stats API endpoint
    Value: !Sub "https://${VisitorApi}.execute-api.${AWS::Region}.amazonaws.com/prod/stats"
